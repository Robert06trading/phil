# Production-style deployment. Secrets come from .env (never committed).
# TLS: Caddy terminates HTTPS for the dashboard and API (set DOMAIN in .env).
# IB Gateway is NOT included: run IBKR's official IB Gateway (or a maintained
# container image of it) and point TRADER_IBKR_HOST/PORT at it — see docs.
x-trader: &trader
  build: .
  env_file: .env
  environment:
    TRADER_DATABASE_URL: postgresql+psycopg://trader:${POSTGRES_PASSWORD}@db:5432/trader
  volumes:
    - trader-data:/app/data
    - trader-logs:/app/logs
    - trader-reports:/app/reports
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  networks: [internal]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trader
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  engine:
    <<: *trader
    command: ["python", "main.py", "run"]
    stop_grace_period: 60s
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach an IB Gateway on the host

  api:
    <<: *trader
    command: ["python", "main.py", "api", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s

  dashboard:
    <<: *trader
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      TRADER_DATABASE_URL: postgresql+psycopg://trader:${POSTGRES_PASSWORD}@db:5432/trader
      TRADER_API_URL: http://api:8000
    healthcheck:
      disable: true

  watchdog:
    <<: *trader
    command: ["python", "scripts/watchdog.py"]
    healthcheck:
      disable: true

  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://trader:${POSTGRES_PASSWORD}@db:5432/trader
    volumes:
      - ./scripts/backup_db.sh:/backup_db.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do /backup_db.sh; sleep 86400; done"]
    depends_on: [db]
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    ports: ["443:443", "80:80"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api, dashboard]
    restart: unless-stopped
    networks: [internal]

volumes:
  pg-data:
  trader-data:
  trader-logs:
  trader-reports:
  caddy-data:

networks:
  internal:
